# SAM テンプレートの検査と、Lambda に載せるコードが作れることの確認（strategy.md ⑤、docs/04_operations/ci-cd.md）
# デプロイはしない（AWS の認証情報を使わない）
name: infra

on:
  push:
    branches: [main]
    paths: &paths
      - "infra/**"
      - "apps/api/**"
      - "contracts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/infra.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

env:
  SAM_CLI_TELEMETRY: "0"
  AWS_DEFAULT_REGION: ap-northeast-1
  SAM_CLI_VERSION: "1.172.1"
  CFN_LINT_VERSION: "1.60.1"

jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: sam validate（cfn-lint 込み）
        working-directory: infra
        run: uvx --from "aws-sam-cli==${SAM_CLI_VERSION}" sam validate --lint

      - name: cfn-lint
        working-directory: infra
        run: uvx "cfn-lint==${CFN_LINT_VERSION}" template.yaml github-deploy.yaml

      - name: Lambda のコードを作る（uv.lock どおり、arm64 の wheel）
        run: bash infra/build.sh
