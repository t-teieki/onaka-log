[project]
name = "onaka-api"
version = "0.1.0"
description = "onaka-log のバックエンド（FastAPI on Lambda）。ドメインのルール・推定・照合・保存"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "pyyaml>=6.0", "fastapi>=0.115", "httpx>=0.27", "anthropic>=0.40", "boto3>=1.35", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onaka_api"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 日本語の全角文字を誤検知するため

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "onaka_api.domain.*"
strict = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "yaml"]
ignore_missing_imports = true
