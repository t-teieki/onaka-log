[project]
name = "onaka-log-tools"
version = "0.0.0"
description = "onaka-log の契約テスト・PoC 用ツール（アプリ本体ではない）"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "pyyaml>=6.0.3",
    "openapi-spec-validator>=0.9.0",
]
poc = ["anthropic", "pillow", "httpx", "python-dotenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
