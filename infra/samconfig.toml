# sam deploy の環境ごとの設定（ADR-0014）。使い方は infra/README.md
version = 0.1

[default.global.parameters]
region = "ap-northeast-1"

[default.validate.parameters]
lint = true

[dev.deploy.parameters]
stack_name = "onaka-log-dev"
resolve_s3 = true
s3_prefix = "onaka-log-dev"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
# GoogleClientId は Google Cloud の OAuth クライアント（秘密ではない）。CallbackUrls の exp:// は PC の LAN の IP（変わったら書き換えてデプロイし直す、Q-45）
parameter_overrides = "Env=dev ClaudeApiKeyParamName=/onaka-log/dev/claude-api-key GoogleClientId=365571765743-6rdt1fb35vstoaucr3hfp20lc1efv1vc.apps.googleusercontent.com GoogleClientSecretName=onaka-log/dev/google-client-secret CallbackUrls='onakalog://auth/callback,exp://192.168.3.2:8081/--/auth/callback'"
tags = "project=onaka-log env=dev"

[prod.deploy.parameters]
stack_name = "onaka-log-prod"
resolve_s3 = true
s3_prefix = "onaka-log-prod"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
parameter_overrides = "Env=prod ClaudeApiKeyParamName=/onaka-log/prod/claude-api-key GoogleClientId=REPLACE_ME.apps.googleusercontent.com GoogleClientSecretName=onaka-log/prod/google-client-secret"
tags = "project=onaka-log env=prod"
