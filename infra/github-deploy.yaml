AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  onaka-log を GitHub Actions からデプロイするための IAM（ADR-0019、CIC-05・CIC-09）。
  GitHub の OIDC プロバイダー・GitHub が引き受けるデプロイ用ロール・CloudFormation の実行ロール。
  アプリのスタック（template.yaml）とは別に、管理者が手元から 1 回だけ作る（infra/README.md）。

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
  GitHubRepository:
    Type: String
    Default: t-teieki/onaka-log
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: デプロイを許すリポジトリ（owner/name）
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      GitHub の OIDC プロバイダーはアカウントに 1 つだけ。dev で作ったら、prod のスタックでは false にする
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: CreateOidcProvider が false のとき、既にある GitHub の OIDC プロバイダーの ARN

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # GitHub Actions が引き受けるロール。できるのは、成果物を S3 に置くことと、
  # onaka-log-<env> のスタックを変更セットで更新すること（実際のリソース作成は下の実行ロールが行う）
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub onaka-log-github-deploy-${Env}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # GitHub の Environment（dev / prod）を指定したジョブからだけ引き受けられる
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${Env}
      Policies:
        - PolicyName: sam-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/onaka-log-${Env}/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: TemplateReadOnly
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: "*"
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  # CloudFormation がスタックのリソースを作るときに使うロール（sam deploy --role-arn）。
  # 扱えるのは onaka-log の名前が付いたリソースだけに絞る
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub onaka-log-cfn-exec-${Env}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: onaka-log-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:onaka-log-api-${Env}
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:onaka-log-api-${Env}:*
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:CodeDeployHook_onaka-log-pretraffic-${Env}
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:CodeDeployHook_onaka-log-pretraffic-${Env}:*
              - Sid: LambdaLayer
                Effect: Allow
                Action: lambda:GetLayerVersion
                Resource: !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:*
              - Sid: Code
                Effect: Allow
                Action: s3:GetObject
                Resource: arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
              - Sid: Table
                Effect: Allow
                Action: dynamodb:*
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/onaka-log-${Env}
              - Sid: Cognito
                Effect: Allow
                Action: cognito-idp:*
                Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
              - Sid: CognitoCreate
                Effect: Allow
                Action:
                  - cognito-idp:CreateUserPool
                  - cognito-idp:DescribeUserPoolDomain
                  - cognito-idp:CreateUserPoolDomain
                  - cognito-idp:UpdateUserPoolDomain
                  - cognito-idp:DeleteUserPoolDomain
                Resource: "*"
              - Sid: GoogleClientSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:onaka-log/${Env}/google-client-secret-*
              - Sid: ApiGateway
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource: !Sub arn:aws:apigateway:${AWS::Region}::/*
              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onaka-log-api-${Env}*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CodeDeployHook_onaka-log-pretraffic-${Env}*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/onaka-log-api-${Env}*
              - Sid: LogsDelivery
                # API Gateway のアクセスログの設定に要る（リソースを絞れない操作）
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
              - Sid: Alarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:onaka-log-api-${Env}-*
              - Sid: CodeDeploy
                Effect: Allow
                Action: codedeploy:*
                Resource:
                  - !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:onaka-log-${Env}-*
                  - !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:onaka-log-${Env}-*
                  - !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*
              # スタックが作る IAM ロール（Lambda の実行ロール・CodeDeploy のサービスロール）。
              # 名前は SAM が「<スタック名>-<論理 ID>-<乱数>」で付けるので、接頭辞で絞る
              - Sid: StackRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/onaka-log-${Env}-*

Outputs:
  DeployRoleArn:
    Description: GitHub のリポジトリ変数 AWS_DEPLOY_ROLE_ARN_<ENV> に入れる
    Value: !GetAtt DeployRole.Arn
  ExecutionRoleArn:
    Description: GitHub のリポジトリ変数 AWS_CFN_EXEC_ROLE_ARN_<ENV> に入れる
    Value: !GetAtt ExecutionRole.Arn
